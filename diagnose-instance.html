<!DOCTYPE html>
<html>
<head>
  <title>Vue Instance Diagnostics</title>
  <script src="http://localhost:8083/js/chunk-vendors.js"></script>
  <script src="http://localhost:8083/js/app.js"></script>
</head>
<body>
  <div id="diagnostic"></div>
  
  <script>
    setTimeout(() => {
      const app = document.querySelector('#app');
      if (!app || !app.__vue_app__) {
        document.getElementById('diagnostic').innerHTML = '<h1 style="color:red">No Vue app found</h1>';
        return;
      }
      
      const vueApp = app.__vue_app__;
      const BeautifulChat = vueApp._context.components['BeautifulChat'];
      
      // Try to check if the render function has access to getCurrentInstance
      let diagnosticHTML = '<h2>Vue Instance Diagnostic</h2>';
      diagnosticHTML += '<p><strong>Vue App:</strong> Found</p>';
      diagnosticHTML += '<p><strong>BeautifulChat Component:</strong> ' + (BeautifulChat ? 'Found' : 'Not Found') + '</p>';
      
      if (BeautifulChat) {
        diagnosticHTML += '<p><strong>Component Name:</strong> ' + (BeautifulChat.name || 'N/A') + '</p>';
        diagnosticHTML += '<p><strong>Has Components:</strong> ' + (BeautifulChat.components ? 'Yes (' + Object.keys(BeautifulChat.components).join(', ') + ')' : 'No') + '</p>';
        
        if (BeautifulChat.components && BeautifulChat.components.ChatWindow) {
          diagnosticHTML += '<p><strong>ChatWindow:</strong> Registered</p>';
          diagnosticHTML += '<p><strong>ChatWindow Name:</strong> ' + (BeautifulChat.components.ChatWindow.name || 'N/A') + '</p>';
        }
      }
      
      document.getElementById('diagnostic').innerHTML = diagnosticHTML;
      
      // Check the actual rendered chatwindow element
      setTimeout(() => {
        document.querySelector('.sc-launcher')?.click();
        
        setTimeout(() => {
          const chatwindow = document.querySelector('chatwindow');
          if (chatwindow) {
            diagnosticHTML += '<p style="color:red"><strong>Issue Found:</strong> chatwindow element exists as custom HTML element</p>';
            diagnosticHTML += '<p><strong>Element Tag:</strong> ' + chatwindow.tagName + '</p>';
            diagnosticHTML += '<p><strong>Has Content:</strong> ' + (chatwindow.innerHTML ? 'Yes' : 'No (EMPTY)') + '</p>';
            document.getElementById('diagnostic').innerHTML = diagnosticHTML;
          }
        }, 1000);
      }, 1000);
      
    }, 2000);
  </script>
</body>
</html>
